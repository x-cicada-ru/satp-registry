name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install --no-audit --no-fund

      - name: Validate dist data
        run: node -e "const b=require('./dist/kv-bulk.json');if(!Array.isArray(b)||b.length<100)process.exit(1);console.log('dist ok:',b.length,'entries')"

      - name: Run tests
        run: node tests.mjs

      - name: Deploy worker + KV
        run: node deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}