<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SATP · Реестр</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Реестр<small>SATP</small></div>
    <input id="search" type="search" placeholder="Поиск по ФИО / названию…" autocomplete="off">
    <div class="count" id="count"></div>
    <button id="themeBtn" class="btn" title="Тема">◐</button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">Файлы</div>
      <div id="tree"></div>
      <div id="sideFoot"></div>
    </aside>
    <main class="content" id="content"></main>
    <aside class="pane hidden" id="pane">
      <div class="side-head" id="paneTitle"></div>
      <div id="paneBody"></div>
    </aside>
  </div>
</div>
<script src="vendor/markdown-it.min.js"></script>
<script src="data/manifest.js"></script>
<script src="app.js"></script>
</body>
</html>
